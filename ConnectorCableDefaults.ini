; Default cable selected only when starting at an untyped unit connector.
; Keys are stable connector file names, including .txt (not numeric type IDs).
; Values are cable file names already present in Cables/.
; Empty/missing entries leave the existing manual workflow unchanged.
; RF N/BNC and E1 remain manual: their opposite connector/crossing is ambiguous.
; ETH_RJ45_100BTX has no default: the radio LAN cable is directional (2..9 -> 1..8).
[DefaultCable]
RS_XU4200_AC_LNE.txt=RS_XU4200_AC_LNE.txt
RS_XU4200_DC_XLR3.txt=RS_XU4200_DC_XLR3_BREAKOUT.txt
RS_XU4200_LAN_RJ45.txt=RS_XU4200_LAN_RJ45_DIRECT.txt
RS_XU4200_TX_AUDIO_10P.txt=RS_XU4200_TX_AUDIO_1A1_10P.txt
RS_XU4200_RX_AUDIO_10P.txt=RS_XU4200_RX_AUDIO_1A1_10P.txt
RS_XU4200_TX_EXT_DSUB15.txt=RS_XU4200_TX_EXT_1A1_DSUB15.txt
RS_XU4200_RX_EXT_DSUB15.txt=RS_XU4200_RX_EXT_1A1_DSUB15.txt
